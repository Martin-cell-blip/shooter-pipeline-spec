name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: golden proposal must have zero FAIL
        run: |
          python -m pipeline.fixture build 2026-09-17
          python -m pipeline.fixture build 2026-09-08
          python -m pipeline.check 2026-09-08_official
          python -m pipeline.check 2026-09-17_official
      - name: REVIEW decisions file is complete and well-formed (step 9)
        run: python -m pipeline.decisions
      - name: fixture build is idempotent (no diff after rebuild)
        run: git diff --exit-code -- config/fixtures
