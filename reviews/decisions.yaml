_rules:
- 每条决定必须带 reason 与 scope（限定到 hero + 字段/检查），不得写全局豁免
- decision ∈ accepted / false_positive / needs_revision / resolved；pending 表示尚未处置
- 本文件由人填写；机器只生成模板与校验格式
