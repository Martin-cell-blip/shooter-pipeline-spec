  item: 'P0_provenance_status: open source conflict on weapons.healing_ofuda.projectile_speed: {''patch_notes_official'': 18, ''wiki_fandom'': ''30 (homing) / 24 (non-homing)''} — wiki 在补丁两周后未更新；且 wiki
