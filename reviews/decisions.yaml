  decision: accepted
  reason: 采信执行方。变形时间 1.95→0.95 s 是自身硬直缩短，官方注释明写“缩短变形时间以对齐 D.Va”，属增强；审核方只见 duration 变短、按保守读法判削弱，是上下文缺失导致，不是执行方错
  scope: dmon abilities.call_mech.duration_s（2026-09-08）
