  reason: 取官方补丁值 18，接受冲突未关的风险。wiki 未同步且区分 homing/non-homing 两个速度而补丁只给一个数；当前所有依赖该字段的指标本就为 NOT_RUN，不影响其他结论。待 wiki 更新后复核关闭
